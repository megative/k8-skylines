name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs these; the default GITHUB_TOKEN has neither.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy: a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Do not publish a bundle that does not typecheck or pass its tests.
      - run: npm run typecheck
      - run: npm test

      # vite.config.ts sets base: './', so the bundle works from any subpath
      # and needs no repository name baked in.
      - run: npm run build
        env:
          K8SKYLINES_GIT_SHA: ${{ github.sha }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
