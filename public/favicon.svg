<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="K8Skylines">
  <!-- Our own helm (Kubernetes = the helmsman) with the city's ghost skyline in
       the hub. Evokes the symbol; it is not the Foundation's logo. -->
  <rect width="64" height="64" rx="12" fill="#0b1018"/>
  <g stroke="#38e8ff" stroke-width="2.6" stroke-linecap="round" fill="none">
    <circle cx="32" cy="32" r="21.5"/>
    <g transform="rotate(0 32 32)"><line x1="32" y1="24" x2="32" y2="6"/><circle cx="32" cy="5.4" r="1.9" fill="#38e8ff" stroke="none"/></g>
    <g transform="rotate(51.43 32 32)"><line x1="32" y1="24" x2="32" y2="6"/><circle cx="32" cy="5.4" r="1.9" fill="#38e8ff" stroke="none"/></g>
    <g transform="rotate(102.86 32 32)"><line x1="32" y1="24" x2="32" y2="6"/><circle cx="32" cy="5.4" r="1.9" fill="#38e8ff" stroke="none"/></g>
    <g transform="rotate(154.29 32 32)"><line x1="32" y1="24" x2="32" y2="6"/><circle cx="32" cy="5.4" r="1.9" fill="#38e8ff" stroke="none"/></g>
    <g transform="rotate(205.71 32 32)"><line x1="32" y1="24" x2="32" y2="6"/><circle cx="32" cy="5.4" r="1.9" fill="#38e8ff" stroke="none"/></g>
    <g transform="rotate(257.14 32 32)"><line x1="32" y1="24" x2="32" y2="6"/><circle cx="32" cy="5.4" r="1.9" fill="#38e8ff" stroke="none"/></g>
    <g transform="rotate(308.57 32 32)"><line x1="32" y1="24" x2="32" y2="6"/><circle cx="32" cy="5.4" r="1.9" fill="#38e8ff" stroke="none"/></g>
  </g>
  <circle cx="32" cy="32" r="9" fill="#0b1018" stroke="#38e8ff" stroke-width="1.6"/>
  <!-- the city, scaled for the hub: two built towers, the tallest still a ghost -->
  <rect x="27.6" y="33.4" width="2.4" height="4.6" rx="0.5" fill="#2fd8c8"/>
  <rect x="31.2" y="31" width="2.4" height="7" rx="0.5" fill="#38e8ff"/>
  <rect x="34.8" y="29.2" width="2.4" height="8.8" rx="0.5" fill="none" stroke="#38e8ff" stroke-width="1.1" stroke-dasharray="1.6 1.3"/>
  <rect x="27.2" y="38.4" width="9.8" height="1.5" rx="0.5" fill="#9d6cff"/>
</svg>
