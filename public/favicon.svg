<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="K8Skylines">
  <!-- Original mark: a skyline where one tower is still a ghost (desired state)
       and the others are built (actual). Deliberately not a helm wheel. -->
  <rect width="64" height="64" rx="12" fill="#0b1018"/>
  <g>
    <!-- built towers: actual state -->
    <rect x="10" y="30" width="10" height="22" rx="1.5" fill="#2fd8c8"/>
    <rect x="23" y="20" width="10" height="32" rx="1.5" fill="#38e8ff"/>
    <!-- ghost tower: desired state, not yet matter -->
    <rect x="36" y="14" width="10" height="38" rx="1.5" fill="none" stroke="#38e8ff" stroke-width="2" stroke-dasharray="3 2.5" opacity="0.85"/>
    <!-- the vault below grade -->
    <rect x="10" y="55" width="36" height="4" rx="1" fill="#9d6cff"/>
  </g>
</svg>
